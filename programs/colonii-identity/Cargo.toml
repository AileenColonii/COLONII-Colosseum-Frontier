[package]
name = "colonii-identity"
version = "0.1.0"
description = "COLONII on-chain identity layer: DIDs, Verifiable Credentials, and memory anchors on Solana."
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
name = "colonii_identity"

[features]
anchor-debug = []
custom-heap = []
custom-panic = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
solana-sha256-hasher = "2.3.0"
